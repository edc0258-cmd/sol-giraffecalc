<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>요리 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark}:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:light-dark(#fff,#121017);color:light-dark(#1b1820,#f0edf4);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif}
.msg{max-width:560px;margin:clamp(24px,6vw,64px) auto;padding:0 16px;text-align:center;color:light-dark(#625c6b,#a59fae)}
</style>
<style id="sitenav-css">
.sitenav{position:sticky;top:0;z-index:50;background:#14121c;border-bottom:1px solid #2c2838;font:500 15px/1 "Noto Sans KR",system-ui,sans-serif}
.sitenav .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:4px;padding:0 max(5vw,16px);overflow-x:auto;scrollbar-width:none}
.sitenav a{color:#c9c4d6;text-decoration:none;padding:0 14px;min-height:46px;display:flex;align-items:center;white-space:nowrap;border-bottom:3px solid transparent}
.sitenav a:hover{color:#fff}
.sitenav a[aria-current]{color:#fff;border-bottom-color:#f2c14e;font-weight:700}
.sitenav .home{font-weight:700;color:#f2c14e;padding-left:0;margin-right:8px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<link rel="preload" href="fonts/do-hyeon-site.woff2" as="font" type="font/woff2" crossorigin>
<style id="dh-site">@font-face{font-family:"DHsite";src:url("fonts/do-hyeon-site.woff2") format("woff2");font-display:block}</style>
</head>
<body>
<nav class="sitenav"><div class="in"><a class="home" href="./">기린서버 생활 계산기</a><a href="enhance.html">강화 기대값</a><a href="market.html" data-need="member">요리 재료 거래소</a><a href="cooking.html" data-need="요리사" aria-current="page">요리</a><a href="alchemy.html" data-need="연금술사">연금술</a><a href="admin.html" data-need="운영자">운영자</a></div></nav>
<main id="box"><p class="msg">확인하는 중…</p></main>
<script>
{
const FILE='cooking.html',NEED='요리사',LABEL='요리 계산기';
const box=document.getElementById('box');let done=false;
async function go(){
  if(done)return;
  await Auth.ready;
  if(!Auth.gate(box,NEED,LABEL))return;
  if(!Auth.sb){box.innerHTML='<p class="msg">데이터베이스(config.js)를 연결해야 계산기를 불러올 수 있어요.</p>';return}
  box.innerHTML='<p class="msg">계산기를 불러오는 중…</p>';
  const {data,error}=await Auth.sb.storage.from('pages').download(FILE);
  if(error||!data){box.innerHTML='<p class="msg">계산기 파일을 불러오지 못했어요. 운영자 페이지에서 '+FILE+' 파일이 올라가 있는지 확인해 주세요.</p>';return}
  const html=await data.text();
  done=true;document.open();document.write(html);document.close();
}
go();Auth.onChange(go);
}
</script>
</body>
</html>
