# Supabase 무료 플랜은 일주일 동안 사용이 없으면 일시정지돼요.
# 3일마다 데이터베이스를 한 번 불러서 멈추지 않게 해요.
# 주소와 키는 저장소의 config.js에서 읽어요. (공개용 publishable/anon 키만 써요)
name: Supabase 깨우기

on:
  schedule:
    - cron: '23 3 */3 * *'   # 3일마다 낮 12시 23분(한국 시간)쯤
  workflow_dispatch:         # Actions 탭에서 'Run workflow'로 바로 실행해 볼 수 있어요

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false
      - name: 데이터베이스 한 번 부르기
        run: |
          URL=$(grep -oE "url *: *['\"][^'\"]+" config.js | sed -E "s/.*['\"]//; s#/+\$##")
          KEY=$(grep -oE "key *: *['\"][^'\"]+" config.js | sed -E "s/.*['\"]//")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js에서 주소나 키를 찾지 못했어요."; exit 1; fi
          for i in 1 2 3; do
            CODE=$(curl -s -o res.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/keepalive" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
            if [ "$CODE" = "200" ]; then echo "성공: $(cat res.txt)"; exit 0; fi
            echo "시도 $i 실패 ($CODE): $(cat res.txt)"; sleep 20
          done
          echo "Supabase에 연결하지 못했어요. 프로젝트가 이미 멈췄다면 대시보드에서 Resume project를 눌러 주세요."
          exit 1
